<!DOCTYPE html>
<html>
  <head>
    <title>Siddhanth-Aurva Assignment</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        --primary-color: #3498db;
        --secondary-color: #2ecc71;
        --background-color: #f4f6f7;
        --card-color: #ffffff;
        --text-color: #2c3e50;
      }

      * {
        box-sizing: border-box;
        transition: all 0.3s ease;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--background-color);
        color: var(--text-color);
        line-height: 1.6;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        min-height: 100vh;
        align-items: center;
      }

      .container {
        width: 100%;
        max-width: 600px;
        background-color: var(--card-color);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 30px;
        margin: 20px;
      }

      h1 {
        text-align: center;
        color: var(--primary-color);
        margin-bottom: 25px;
        font-weight: 600;
      }

      .file-upload-section {
        background-color: var(--background-color);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
        transition: transform 0.3s, box-shadow 0.3s;
      }

      .file-upload-section:hover {
        transform: translateY(-5px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      input[type="file"] {
        width: 100%;
        padding: 12px;
        border: 2px dashed var(--primary-color);
        border-radius: 8px;
        text-align: center;
        cursor: pointer;
      }

      input[type="file"]:hover {
        border-color: var(--secondary-color);
      }

      button {
        width: 100%;
        padding: 12px;
        background-color: var(--primary-color);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 10px;
        font-weight: 600;
      }

      button:hover {
        background-color: #2980b9;
        transform: translateY(-2px);
      }

      .scan-result {
        background-color: var(--background-color);
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 15px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        transition: transform 0.3s, box-shadow 0.3s;
      }

      .scan-result:hover {
        transform: scale(1.02);
        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
      }

      .scan-result h3 {
        margin: 0 0 10px;
        color: var(--primary-color);
      }

      .finding h4 {
        color: var(--secondary-color);
        margin-bottom: 5px;
      }

      .delete-btn {
        background-color: #e74c3c;
      }

      .delete-btn:hover {
        background-color: #c0392b;
        transform: translateY(-2px);
      }

      .error {
        background-color: #ffdddd;
        color: #f44336;
        border-radius: 8px;
        padding: 10px;
        margin-top: 10px;
        transition: transform 0.3s;
      }

      .error:hover {
        transform: scale(1.02);
      }

      .loading {
        text-align: center;
        color: var(--primary-color);
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Siddhanth-Aurva Assignment</h1>

      <div>
        <h2>Upload Photo</h2>
        <form id="uploadForm">
          <input type="file" id="fileInput" required />
          <button type="submit">Scan File</button>
        </form>
        <div id="loading" class="loading">Processing file</div>
        <div id="error" class="error"></div>
      </div>

      <div>
        <h2>Scan Results</h2>
        <div id="scanResults"></div>
      </div>
    </div>

    <script>
      async function uploadFile(event) {
        event.preventDefault();

        const formData = new FormData();
        const fileInput = document.getElementById("fileInput");
        const errorDiv = document.getElementById("error");
        const loadingDiv = document.getElementById("loading");

        if (!fileInput.files[0]) {
          errorDiv.style.display = "block";
          errorDiv.textContent = "Please select a file";
          return;
        }

        formData.append("file", fileInput.files[0]);

        try {
          errorDiv.style.display = "none";
          loadingDiv.style.display = "block";

          const response = await fetch("/scan/", {
            method: "POST",
            body: formData,
          });

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const result = await response.json();

          if (result.error) {
            errorDiv.style.display = "block";
            errorDiv.textContent = result.error;
          } else {
            await loadScans();
            fileInput.value = "";
          }
        } catch (error) {
          errorDiv.style.display = "block";
          errorDiv.textContent = "Error uploading file: " + error.message;
          console.error("Error:", error);
        } finally {
          loadingDiv.style.display = "none";
        }
      }

      async function loadScans() {
        const errorDiv = document.getElementById("error");
        const resultsDiv = document.getElementById("scanResults");

        try {
          const response = await fetch("/scans/");
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const scans = await response.json();
          resultsDiv.innerHTML = "";

          if (scans.length === 0) {
            resultsDiv.innerHTML = "<p>No scans found</p>";
            return;
          }

          scans.forEach((scan) => {
            const scanDiv = document.createElement("div");
            scanDiv.className = "scan-result";

            let findingsHtml = "";
            if (Object.keys(scan.findings).length === 0) {
              findingsHtml = "<p>No sensitive data found</p>";
            } else {
              findingsHtml = Object.entries(scan.findings)
                .map(
                  ([category, findings]) => `
                            <div class="finding">
                                <h4>${category}</h4>
                                <ul>
                                    ${findings
                                      .map(
                                        (f) => `
                                        <li>${f.type}: ${f.value}</li>
                                    `
                                      )
                                      .join("")}
                                </ul>
                            </div>
                        `
                )
                .join("");
            }

            scanDiv.innerHTML = `
                        <h3>File: ${scan.filename}</h3>
                        <p>Scan Date: ${new Date(
                          scan.scan_date
                        ).toLocaleString()}</p>
                        ${findingsHtml}
                        <button onclick="deleteScan(${
                          scan.file_id
                        })" class="delete-btn">Delete</button>
                    `;

            resultsDiv.appendChild(scanDiv);
          });
        } catch (error) {
          console.error("Error:", error);
          errorDiv.style.display = "block";
          errorDiv.textContent = "Error loading scans: " + error.message;
        }
      }

      async function deleteScan(scanId) {
        const errorDiv = document.getElementById("error");

        try {
          const response = await fetch(`/scans/${scanId}`, {
            method: "DELETE",
          });

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          await loadScans();
        } catch (error) {
          console.error("Error:", error);
          errorDiv.style.display = "block";
          errorDiv.textContent = "Error deleting scan: " + error.message;
        }
      }

      document
        .getElementById("uploadForm")
        .addEventListener("submit", uploadFile);
      loadScans();
    </script>
  </body>
</html>
